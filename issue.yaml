issue:
  title: "Cannot access Telegram account — login code sent to active session I don't have access to"
  body: |
    Hello,

    I am unable to access my Telegram account. On 30 August, at approximately 22:30 MSK, I was suddenly logged out of my account on my phone. When I try to log back in, the only option given is to enter a code sent to an active session — but I do not have access to that session.

    I still have access to my phone number, but there is no option to receive the code via SMS or any other method — only through the active session, which I believe belongs to the attacker.

    Additionally, my friends who I had recent conversations with told me that all messages from the last 12 hours have been deleted from our chats. This confirms that my account has been compromised.

    I have contacted official support through email and other channels, but I have not received any response for over a day.

    This account contains all my work and personal archive. I urgently need help restoring access. I am afraid the attacker may delete the account permanently without any possibility of recovery.

    Please help me recover my account.

    Thank you.

